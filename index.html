<!DOCTYPE html>
<html>
<head>

<script>
(function () {
  const saved = document.cookie.match(/lang=([^;]+)/);

  // если пользователь уже выбирал язык — используем его
  if (saved) {
    window.location.href = '/' + saved[1] + '/';
    return;
  }

  const userAgent = navigator.userAgent.toLowerCase();

  if (userAgent.includes('bot') || userAgent.includes('crawl') || userAgent.includes('spider')) {
    window.location.href = '/en/';
    return;
  }

  const ruGroup = ['ru','uk','be','kk'];
  const supported = ['ru','en','de','fr','it','lv','pl'];

  const lang = (navigator.language || '').toLowerCase().slice(0,2);

  let target = 'en';

  if (ruGroup.includes(lang)) target = 'ru';
  else if (supported.includes(lang)) target = lang;

  document.cookie = 'lang=' + target + '; path=/; max-age=31536000';

  window.location.href = '/' + target + '/';
})();
</script>

</head>
<body></body>
</html>
