    const dSub   = document.getElementById('d-sub');
    const dBtn   = document.getElementById('d-btn');
    const dNote  = document.getElementById('d-note');
    const kTitle = document.getElementById('k-title');
    const kSub   = document.getElementById('k-sub');
    const kBtn   = document.getElementById('k-btn');
    const kNote  = document.getElementById('k-note');
    const fTitle = document.getElementById('f-title');
    const faqBody= document.getElementById('faq-body');
    const jTitle = document.getElementById('j-title');
    const jSub   = document.getElementById('j-sub');
    const fCopy  = document.getElementById('f-copy');
    const sig    = document.getElementById('sig');

    function renderFAQ(list){
      faqBody.innerHTML = "";
      list.forEach(([q,a]) => {
        const d = document.createElement('details');
        const s = document.createElement('summary');
        const dot = document.createElement('span');
        dot.className = 'qmark';
        dot.textContent = '?';
        s.append(dot, document.createTextNode(' ' + q));
        d.appendChild(s);
        const p = document.createElement('p');
        p.textContent = a;
        d.appendChild(p);
        faqBody.appendChild(d);
      });
    }

    function applyLang(code){
      const L = tr[code] || tr.en;

      hTitle.textContent = L.hTitle;
      hSub.textContent   = L.hSub;
      dTitle.textContent = L.dTitle;
      dSub.textContent   = L.dSub;
      dBtn.textContent   = L.dBtn;
      dNote.textContent  = L.dNote;
      kTitle.textContent = L.kTitle;
      kSub.textContent   = L.kSub;
      kBtn.textContent   = L.kBtn;
      kNote.textContent  = L.kNote;
      fTitle.textContent = L.fTitle;
      jTitle.textContent = L.jTitle;
      jSub.textContent   = L.jSub;
      fCopy.textContent  = L.copy;
      sig.textContent    = L.sig;

      renderFAQ(L.faq);

      // клик по кнопке чек-листа = «скачивание»
      dBtn.onclick = function(){
        fbq('track','Lead',{content_name:'Checklist_50Plus',language:code});
        fbq('trackCustom','Checklist_50Plus_Downloaded',{language:code});
        window.open(L.file,'_blank');
      };
    }

    function setLang(code){
      langSelect.value = code;
      applyLang(code);
    }

    // автоопределение языка
    const userLang = (navigator.language || 'en').slice(0,2).toLowerCase();
    const initial  = tr[userLang] ? userLang : 'en';
    setLang(initial);

    langSelect.addEventListener('change', e => setLang(e.target.value));

    // событие 7 секунд просмотра
    setTimeout(() => {
      fbq('trackCustom','ViewContent_hub_7s');
    }, 7000);
