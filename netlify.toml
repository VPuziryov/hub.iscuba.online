[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"

[[redirects]]
  from = "/wp-login.php"
  to = "/"
  status = 301


[[redirects]]
from = "/assets/downloads/red-sea-routes-ru"
to = "/assets/downloads/egypt-routes-current-ru.pdf"
status = 302
force = true

[[redirects]]
from = "/assets/downloads/red-sea-routes-en"
to = "/assets/downloads/egypt-routes-current-en.pdf"
status = 302
force = true



[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Revalidate corrected giveaway PDFs and Egypt CTA pages.
[[headers]]
  for = "/assets/downloads/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*/egypt/*"
  [headers.values]
    Cache-Control = "no-cache"
